<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-left" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#fafafa"/>

  <!-- Test Host Box -->
  <rect x="40" y="60" width="200" height="260" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="140" y="90" text-anchor="middle" font-weight="bold" font-size="16" fill="#1976d2">Test Host</text>
  <text x="140" y="115" text-anchor="middle" font-size="13" fill="#555">(Python)</text>

  <!-- Test Host Components -->
  <rect x="60" y="135" width="160" height="30" rx="4" fill="#fff" stroke="#90caf9" stroke-width="1"/>
  <text x="140" y="155" text-anchor="middle" font-size="12" fill="#333">pytest</text>

  <rect x="60" y="175" width="160" height="30" rx="4" fill="#fff" stroke="#90caf9" stroke-width="1"/>
  <text x="140" y="195" text-anchor="middle" font-size="12" fill="#333">equipment-cmw500</text>

  <rect x="60" y="215" width="160" height="30" rx="4" fill="#fff" stroke="#90caf9" stroke-width="1"/>
  <text x="140" y="235" text-anchor="middle" font-size="12" fill="#333">rainbird-ncc2-modem-poc</text>

  <!-- CMW500 Box -->
  <rect x="400" y="60" width="220" height="320" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="510" y="90" text-anchor="middle" font-weight="bold" font-size="16" fill="#f57c00">CMW500</text>

  <!-- CMW500 REMOTE LAN -->
  <rect x="420" y="115" width="180" height="55" rx="4" fill="#fff" stroke="#ffb74d" stroke-width="1"/>
  <text x="510" y="138" text-anchor="middle" font-weight="bold" font-size="12" fill="#333">REMOTE LAN</text>
  <text x="510" y="158" text-anchor="middle" font-size="11" fill="#666">172.22.1.4/16</text>

  <!-- CMW500 LAN DAU -->
  <rect x="420" y="185" width="180" height="55" rx="4" fill="#fff" stroke="#ffb74d" stroke-width="1"/>
  <text x="510" y="208" text-anchor="middle" font-weight="bold" font-size="12" fill="#333">LAN DAU</text>
  <text x="510" y="228" text-anchor="middle" font-size="11" fill="#666">Data Application Unit</text>

  <!-- CMW500 RF COM1 -->
  <rect x="420" y="255" width="180" height="55" rx="4" fill="#fff" stroke="#ffb74d" stroke-width="1"/>
  <text x="510" y="278" text-anchor="middle" font-weight="bold" font-size="12" fill="#333">RF COM1</text>
  <text x="510" y="298" text-anchor="middle" font-size="11" fill="#666">RF Output</text>

  <!-- Quectel Modem Box -->
  <rect x="40" y="380" width="200" height="80" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="140" y="415" text-anchor="middle" font-weight="bold" font-size="16" fill="#388e3c">Quectel EG21</text>
  <text x="140" y="440" text-anchor="middle" font-size="13" fill="#555">Modem</text>

  <!-- Internet/AWS Cloud -->
  <ellipse cx="720" cy="212" rx="55" ry="35" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
  <text x="720" y="208" text-anchor="middle" font-size="12" fill="#0288d1">Internet</text>
  <text x="720" y="224" text-anchor="middle" font-size="12" fill="#0288d1">/AWS</text>

  <!-- Connection: Test Host to CMW500 REMOTE LAN (bidirectional) -->
  <line x1="240" y1="170" x2="420" y2="142" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" marker-start="url(#arrowhead-left)"/>
  <rect x="280" y="130" width="100" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="330" y="147" text-anchor="middle" font-size="10" fill="#333">Ethernet</text>
  <text x="330" y="160" text-anchor="middle" font-size="9" fill="#666">(HiSLIP/SCPI)</text>

  <!-- Connection: CMW500 LAN DAU to Internet -->
  <line x1="600" y1="212" x2="665" y2="212" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="632" y="202" text-anchor="middle" font-size="9" fill="#666">Ethernet</text>

  <!-- Connection: Test Host to Modem (USB) -->
  <line x1="140" y1="320" x2="140" y2="380" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="155" y="355" font-size="10" fill="#333">USB</text>

  <!-- Connection: CMW500 RF to Modem -->
  <path d="M 420 282 Q 300 340 240 400" stroke="#d32f2f" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <rect x="270" y="345" width="120" height="35" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="330" y="362" text-anchor="middle" font-size="10" fill="#d32f2f">RF Cable (coax)</text>
  <text x="330" y="375" text-anchor="middle" font-size="9" fill="#666">attenuator optional</text>

  <!-- Legend -->
  <rect x="550" y="400" width="210" height="80" rx="5" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="560" y="420" font-weight="bold" font-size="11" fill="#333">Connections:</text>
  <line x1="560" y1="440" x2="590" y2="440" stroke="#333" stroke-width="2"/>
  <text x="600" y="444" font-size="10" fill="#333">Control/Data (Ethernet)</text>
  <line x1="560" y1="460" x2="590" y2="460" stroke="#d32f2f" stroke-width="2"/>
  <text x="600" y="464" font-size="10" fill="#333">RF Signal (Coax)</text>
</svg>
